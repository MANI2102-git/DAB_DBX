# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "dbxdemo"

variables:
  service_principal_id:
    default: "b0f2252e-7316-422e-83e0-04ae4ef8963d"
    description: Databricks service principal application ID

sync:
  include:
    - notebooks/**/*.ipynb
    - resources/*.yml
    - resources/*/*.yml

resources:
  jobs:
    employee_data:
      name: EmployeeData
      tasks:
        - task_key: generate_csv
          notebook_task:
            notebook_path: ./notebooks/01_generate_csv_file.ipynb
            source: WORKSPACE

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-34326fb0-8193.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-34326fb0-8193.cloud.databricks.com
      # We always use /Users/tmanimegalai2102@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Users/tmanimegalai2102@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as tmanimegalai2102@gmail.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: tmanimegalai2102@gmail.com
